apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-med-erp-common
  namespace: argocd
spec:
  project: med-erp-dev
  source:
    repoURL: https://github.com/gavademahesh98/my-Med-ERP.git
    targetRevision: dev
    path: helm/common
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
