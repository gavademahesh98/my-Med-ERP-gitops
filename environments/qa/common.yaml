apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qa-med-erp-common
  namespace: argocd
spec:
  project: med-erp-qa
  source:
    repoURL: https://github.com/gavademahesh98/my-Med-ERP.git
    targetRevision: qa
    path: helm/common
  destination:
    server: https://kubernetes.default.svc
    namespace: qa
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
