apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-order-service
  namespace: argocd
spec:
  project: med-erp-dev
  source:
    repoURL: https://github.com/gavademahesh98/my-Med-ERP.git
    targetRevision: dev
    path: helm/order-service
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
